spring.application.name=backend
# Configuração da Porta do Servidor
server.port=${PORT:8080}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# Configuração do Banco de Dados (MySQL via Variáveis de Ambiente)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:caseSenai}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuração do JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuração do Jackson
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.deserialization.accept-float-as-int=false

# Configuração do Flyway (Migrations)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
